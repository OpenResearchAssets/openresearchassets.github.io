name: "投稿科研资产 / Submit research asset"
description: "任何 GitHub 用户都可以推荐高审美科研配图、项目主页或真正有用的 Skills / Workflows；人工审核后才入库 / Open to everyone, curated before publishing."
title: "[投稿] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## 欢迎共建 OpenResearchAssets / Everyone can contribute
        只需要提供作品链接与入选理由，不需要写代码。GitHub 自动记录提交者用户名与 Issue 创建时间；**收录日期以审核通过并写入目录的日期为准，不等于投稿日期**。
        第三方图片、论文插图和截图默认只提供官方链接，请勿上传无权转载的原图、私有论文或敏感信息；如果是你自己的可编辑作品，可在下方说明并在 Issue 编辑器中附上文件。
        提交不代表自动发布，编辑者根据真实视觉质量、科学事实、实际用途、许可证和证据决定是否精选。
        ---
        No coding required. Your GitHub account identifies the submitter. Approved entries receive a separate catalog publication date. Do not upload copyrighted media without redistribution rights or unpublished/private materials.
  - type: dropdown
    id: type
    attributes:
      label: "资产类型 / Asset type"
      options:
        - "高审美论文图 / Research figure (Teaser, Results, Ablation...)"
        - "优秀项目主页 / Research project website"
        - "原创可编辑图 / Original editable SVG, PPTX, HTML..."
        - "高热度 Skill / Popular GitHub Skill or tool"
        - "有公开实践证据的 Workflow / Evidence-backed workflow"
    validations:
      required: true
  - type: input
    id: resource-title
    attributes:
      label: "作品名称 / Asset title"
      placeholder: "例如 HyperNeRF — interactive project website"
    validations:
      required: true
  - type: input
    id: original-source
    attributes:
      label: "官方来源 / Original source URL"
      description: "请填写原作者项目主页、仓库或论文的 HTTPS 链接 / Link to the original author."
      placeholder: "https://..."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "为什么值得精选？/ Why does it belong here?"
      description: "最好指出可借鉴的布局、结果呈现、审美细节，或具体 Skill / Workflow 的科研用途。"
      placeholder: "这份资产最值得学习的是什么？如何复用到真实研究中？"
    validations:
      required: true
  - type: input
    id: author
    attributes:
      label: "原作者或团队 / Original creator(s)"
      description: "原作者不是投稿人。如果不确定，可以留空，审核时再核对。"
    validations:
      required: false
  - type: textarea
    id: proof
    attributes:
      label: "证据与可编辑源 / Evidence and editable source (optional)"
      description: "Skill 请给原仓库与可核对 Star；实践工作流需公开产物或使用证据；原创图可提供合法授权的源文件。"
    validations:
      required: false
  - type: textarea
    id: rights
    attributes:
      label: "版权和转载许可 / Copyright and reuse rights"
      description: "说明自己是否是权利人、作品采用的许可证、是否只建议外链展示。不确定请如实说明。"
      placeholder: "例：第三方作品，仅推荐原站链接；不授权本站重新发布图片。"
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: "原创文件或补充材料 / Original uploads (optional)"
      description: "如果你拥有相应权利，可使用编辑器拖放或粘贴文件；大型可编辑源请附公开仓库链接。"
    validations:
      required: false
