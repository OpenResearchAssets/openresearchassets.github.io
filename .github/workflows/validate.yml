name: Validate research assets
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical data and JS checks
        run: |
          python tools/sync_catalog.py --check
          python tests/check_project.py
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python tests/browser_offline_smoke.py

      - name: Archive page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ora-browser-screenshots
          path: tests/_local_*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Lightweight visual preview for audit
        if: success()
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from io import BytesIO
          import base64
          for name in ["home", "detail"]:
              image = Image.open("tests/_local_" + name + "_desktop.png").convert("RGB")
              image = image.crop((0, 0, image.width, min(image.height, 2700)))
              if image.width > 850:
                  image = image.resize((850, round(image.height*850/image.width)))
              buffer = BytesIO()
              image.save(buffer, format="JPEG", quality=57, optimize=True)
              encoded = base64.b64encode(buffer.getvalue()).decode("ascii")
              print("ORA_UI_START:" + name)
              for i in range(0, len(encoded), 4000):
                  print("ORA_UI_DATA:" + encoded[i:i+4000])
              print("ORA_UI_END:" + name)
          case_ids = ["roborender-teaser", "roborender-site", "robodojo-teaser",
                      "robodojo-site", "supermimic-teaser", "supermimic-site"]
          for view in ["desktop", "mobile"]:
              tiles = []
              for case_id in case_ids:
                  picture = Image.open("tests/_local_case_" + case_id + "_" + view + ".png").convert("RGB")
                  region = picture.crop((0, 0, picture.width, min(picture.height, 1030 if view=="desktop" else 970)))
                  w = 410 if view=="desktop" else 280
                  region = region.resize((w, round(region.height*w/region.width)))
                  tiles.append(region)
              tw = tiles[0].width
              th = max(tile.height for tile in tiles)
              sheet = Image.new("RGB", (tw*3, th*2), "#eef2f7")
              for i, tile in enumerate(tiles):
                  sheet.paste(tile, ((i%3)*tw, (i//3)*th))
              sheet.save("tests/_local_contact_" + view + ".png")
              buffer = BytesIO()
              sheet.save(buffer, format="JPEG", quality=46, optimize=True)
              encoded = base64.b64encode(buffer.getvalue()).decode("ascii")
              print("ORA_UI_START:cases-" + view)
              for i in range(0, len(encoded), 4000):
                  print("ORA_UI_DATA:" + encoded[i:i+4000])
              print("ORA_UI_END:cases-" + view)
          PY
