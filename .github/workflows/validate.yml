name: Validate research assets
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical data and JS checks
        run: |
          python tools/sync_catalog.py --check
          python tests/check_project.py
      - name: Install Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Browser smoke test
        run: python tests/browser_offline_smoke.py

      - name: Archive page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ora-browser-screenshots
          path: tests/_local_*.png
          retention-days: 7
          if-no-files-found: ignore
