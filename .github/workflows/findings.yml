name: Refresh Findings
on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/findings.yml
      - tools/update_findings.py
      - tools/findings_enrichment.py
      - tools/findings_offline_translate.py
      - tools/findings_editorial_zh.py
      - data/findings_editorial_zh.json
      - tests/check_findings.py
permissions:
  contents: write
concurrency:
  group: findings-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache English-Chinese translation model
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/argos-translate
            ~/.cache/argos
          key: ora-argos-en-zh-py311-v1
      - name: Install data and offline translation clients
        run: python -m pip install "huggingface_hub>=0.35,<2" "argostranslate>=1.9,<2"
      - name: Verify Argos language pair is available
        run: |
          python - <<'PY'
          from tools.findings_offline_translate import load_translator
          engine = load_translator()
          assert engine.translate("The model learns new skills from experience.")
          print("English → Chinese translation package ready.")
          PY
      - name: Fetch public trends and preserve last valid per-source data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: python tools/update_findings.py
      - name: Validate snapshot schema and source attribution
        run: python tests/check_findings.py --snapshot
      - name: Publish snapshot on latest main without file conflicts
        run: |
          if git diff --quiet -- data/findings.json; then
            echo "No source updates; nothing to publish."
            exit 0
          fi
          cp data/findings.json "$RUNNER_TEMP/ora-findings.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/ora-findings.json" data/findings.json
            git add data/findings.json
            if git diff --cached --quiet; then
              echo "Snapshot was already published."
              exit 0
            fi
            git commit -m "data: refresh sourced Findings snapshot"
            if git push origin HEAD:main; then
              echo "Published verified Findings snapshot."
              exit 0
            fi
            echo "Concurrent main update; retrying snapshot-only commit."
          done
          exit 1
