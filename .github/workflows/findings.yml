name: Refresh Findings
on:
  schedule:
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/findings.yml
      - tools/update_findings.py
permissions:
  contents: write
concurrency:
  group: findings-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install official Hugging Face API client
        run: python -m pip install "huggingface_hub>=0.35,<2"
      - name: Fetch public trends and preserve last valid per-source data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update_findings.py
      - name: Validate snapshot schema and source attribution
        run: python tests/check_findings.py --snapshot
      - name: Commit changed snapshot (only data/findings.json)
        run: |
          if git diff --quiet -- data/findings.json; then
            echo "No source updates; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/findings.json
          git commit -m "data: refresh sourced Findings snapshot"
          git pull --rebase origin main
          git push origin HEAD:main
