<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Observation to Action — editable method diagram template</title>
<desc id="desc">Original conceptual method figure. All labels and shapes are individually editable. Not empirical results.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif}.tiny{font-size:15px;letter-spacing:2px;fill:#85919b;font-weight:700}.h{font-size:32px;letter-spacing:-.7px;fill:#233746;font-weight:700}.sub{font-size:17px;fill:#687984}.lbl{font-size:18px;fill:#294354;font-weight:700}.sm{font-size:14px;fill:#79909b}.stroke{stroke:#cbd9db;stroke-width:1.6}</style>
