<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Editable claim to evidence mapping board</title><desc id="desc">Original editable visual method for mapping a research claim to test, metric, figure and caption; placeholders only.</desc>
<rect x="0" y="0" width="1200" height="720" rx="0" fill="#f7f9fc" stroke="none" stroke-width="1"/>
<text x="54" y="56" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" fill="#6681a1" font-weight="770" letter-spacing="1.5">OPENRESEARCHASSETS  /  EDITABLE STUDY  /  005</text><text x="55" y="110" font-family="Inter,Arial,Helvetica,sans-serif" font-size="44" fill="#18283c" font-weight="790" letter-spacing="-1.6">Claim → Evidence → Figure / Table</text><text x="56" y="145" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#6a7e95" font-weight="500" >Trace every research claim to a test and a final paper artifact.</text><rect x="51" y="186" width="1097" height="463" rx="17" fill="#ffffff" stroke="#dce6ee" stroke-width="1"/><rect x="77" y="218" width="325" height="352" rx="15" fill="#edf4f9" stroke="none" stroke-width="1"/><text x="100" y="256" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" fill="#416580" font-weight="820" >01  RESEARCH CLAIM</text><rect x="434" y="218" width="325" height="352" rx="15" fill="#edf5f4" stroke="none" stroke-width="1"/><text x="457" y="256" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" fill="#416580" font-weight="820" >02  EVIDENCE &amp; TEST</text><rect x="791" y="218" width="325" height="352" rx="15" fill="#f1f0f8" stroke="none" stroke-width="1"/><text x="814" y="256" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" fill="#416580" font-weight="820" >03  PAPER ARTIFACT</text><text x="100" y="305" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" fill="#294763" font-weight="730" >What must be true?</text><rect x="101" y="329" width="278" height="74" rx="11" fill="#ffffff" stroke="#cbdce9" stroke-width="1"/><text x="116" y="360" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#354f6c" font-weight="700" >[Main scientific claim]</text><text x="116" y="385" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#7a8da4" font-weight="520" >[Scope and conditions]</text><rect x="101" y="424" width="278" height="72" rx="11" fill="#dce8f2" stroke="none" stroke-width="1"/><text x="116" y="451" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" fill="#466c91" font-weight="740" >Can this be falsified?</text><text x="116" y="475" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#637d97" font-weight="500" >[Expected failure condition]</text><text x="458" y="305" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" fill="#2c686d" font-weight="740" >What would establish it?</text><rect x="455" y="329" width="280" height="71" rx="10" fill="#ffffff" stroke="#c7dfdc" stroke-width="1"/><text x="472" y="356" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" fill="#35626b" font-weight="680" >[Baseline + controlled test]</text><text x="472" y="381" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#6d8a91" font-weight="520" >[Metric / sample size / seed]</text><rect x="455" y="418" width="280" height="71" rx="10" fill="#ffffff" stroke="#c7dfdc" stroke-width="1"/><text x="472" y="446" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" fill="#35626b" font-weight="680" >[Ablation / counterexample]</text><text x="472" y="472" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#6d8a91" font-weight="520" >[Confounders and caveats]</text><text x="815" y="305" font-family="Inter,Arial,Helvetica,sans-serif" font-size="20" fill="#58578a" font-weight="750" >How should readers see it?</text><rect x="813" y="329" width="278" height="114" rx="10" fill="#ffffff" stroke="#dad7ec" stroke-width="1"/><text x="831" y="356" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" fill="#575789" font-weight="710" >[Figure / Table ID]</text><rect x="835" y="370" width="50" height="45" rx="6" fill="#c4c3e0" stroke="none" stroke-width="1"/><rect x="899" y="383" width="50" height="32" rx="6" fill="#a2a7d2" stroke="none" stroke-width="1"/><rect x="963" y="361" width="50" height="54" rx="6" fill="#818fbe" stroke="none" stroke-width="1"/><rect x="813" y="460" width="278" height="55" rx="10" fill="#e2e1f2" stroke="none" stroke-width="1"/><text x="830" y="493" font-family="Inter,Arial,Helvetica,sans-serif" font-size="16" fill="#635c96" font-weight="660" >[Caption and conclusion link]</text><line x1="386" y1="374" x2="447" y2="374" stroke="#748fa4" stroke-width="4" /><line x1="432" y1="365" x2="449" y2="374" stroke="#748fa4" stroke-width="3" /><line x1="432" y1="383" x2="449" y2="374" stroke="#748fa4" stroke-width="3" /><line x1="742" y1="374" x2="804" y2="374" stroke="#748fa4" stroke-width="4" /><line x1="789" y1="365" x2="805" y2="374" stroke="#748fa4" stroke-width="3" /><line x1="789" y1="383" x2="805" y2="374" stroke="#748fa4" stroke-width="3" /><rect x="101" y="544" width="989" height="58" rx="9" fill="#f6f8fb" stroke="none" stroke-width="1"/><text x="122" y="578" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#55708a" font-weight="830" >FINAL VALIDATION</text><text x="330" y="578" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" fill="#698198" font-weight="550" >[Do the plotted data, caption and paragraph support the same claim?]</text><text x="55" y="690" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" fill="#7a8b9f" font-weight="600" >EDITABLE VECTOR TEMPLATE  /  Replace every bracketed placeholder before publication.</text>
</svg>
