<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">Results storytelling — editable comparison panel</title>
<desc id="desc">Original experiment-figure layout with illustrative placeholder values only, not results from any study.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif}.tiny{font-size:14px;letter-spacing:2px;font-weight:700;fill:#8b99a0}.h{font-size:31px;font-weight:700;fill:#233b48}.sub{font-size:17px;fill:#74838a}.lab{font-size:17px;font-weight:700;fill:#394b55}.num{font-size:16px;font-weight:700;fill:#2f5261}</style></defs>
<rect x="1" y="1" width="1198" height="598" rx="25" fill="#fff" stroke="#dae3e0"/>
<text x="55" y="58" class="tiny">RESULTS FIGURE / EDITABLE TEMPLATE</text><text x="55" y="101" class="h">Lead with the comparison that matters.</text><text x="55" y="132" class="sub">Illustrative values only — replace with your real measurements, uncertainties and definitions.</text>
