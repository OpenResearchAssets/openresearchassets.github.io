    <text x="118" y="575" font-size="31" font-weight="650" letter-spacing="0.4">Stage 3 — Open research infrastructure</text>
    <text x="69" y="628" fill="#666666" font-size="25" font-weight="400" letter-spacing="-0.15">Shared research-asset standards connect tools, workflows, agents, and communities</text>
  </g>
  <g fill="none" stroke="#636363" stroke-width="3.1" stroke-linecap="round" stroke-linejoin="round">
