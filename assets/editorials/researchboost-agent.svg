<text x="194" y="727" fill="#16283e" font-size="25" font-weight="760" text-anchor="start" >最终验收 · 独立完整检查</text>
<text x="194" y="757" fill="#607389" font-size="18" font-weight="450" text-anchor="start" >完整冻结评测器通过，再进行真实端到端训练或评测复核</text>
<text x="700" y="824" fill="#8190a0" font-size="14" font-weight="400" text-anchor="middle" >本站原创流程解读 · 依据上游 README、goal-mode.md 与 judge.md · 非独立复现声明</text>
