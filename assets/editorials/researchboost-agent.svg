<text x="733" y="544" fill="#7a91aa" font-size="16" font-weight="700" text-anchor="start" >03</text>
<text x="733" y="576" fill="#263b55" font-size="22" font-weight="680" text-anchor="start" >对照计时</text>
<path d="M989 555 h12" stroke="#8ca2b9" stroke-width="2.5" stroke-linecap="round"/><path d="M995 550 l6 5 l-6 5" stroke="#8ca2b9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="1010" y="518" width="264" height="73" rx="14" fill="#ffffff" stroke="#dfe7ef" stroke-width="1.4"/>
