<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">先固定规则，再让 Agent 优化训练</title><desc id="desc">允许 Agent 自由优化实现，但不允许随结果修改科学约束与验收标准</desc>
<style>text{font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",Arial,sans-serif} .small{letter-spacing:.08em}</style>
<rect x="3" y="3" width="1394" height="844" rx="24" fill="#fcfdff" stroke="#e0e6ed" stroke-width="2"/>
<text x="93" y="51" fill="#42709f" font-size="16" font-weight="750" text-anchor="start" class="small">RESEARCHBOOST-AGENT / WORKFLOW</text>
<text x="93" y="98" fill="#15273c" font-size="36" font-weight="800" text-anchor="start" >先固定规则，再让 Agent 优化训练</text>
<text x="93" y="130" fill="#607389" font-size="19" font-weight="450" text-anchor="start" >允许 Agent 自由优化实现，但不允许随结果修改科学约束与验收标准</text>
<rect x="93" y="153" width="1214" height="102" rx="20" fill="#ffffff" stroke="#dfe7ef" stroke-width="1.6"/>
<circle cx="139" cy="203" r="25" fill="#e9f0fa"/><text x="139" y="210" fill="#315e9c" font-size="21" font-weight="750" text-anchor="middle" >01</text>
<text x="194" y="200" fill="#16283e" font-size="25" font-weight="760" text-anchor="start" >Formulator · 任务定义</text>
<text x="194" y="229" fill="#607389" font-size="18" font-weight="450" text-anchor="start" >检查代码与训练命令，明确 GPU、基线、可修改范围和数值约束</text>
<path d="M700 259 V275" fill="none" stroke="#8a9db2" stroke-width="3" stroke-linecap="round"/><path d="M689 265 L700 276 L711 265" fill="none" stroke="#8a9db2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="93" y="286" width="1214" height="103" rx="20" fill="#f6f9fd" stroke="#bfd2e9" stroke-width="2"/>
<circle cx="139" cy="336" r="25" fill="#e9f0fa"/><text x="139" y="343" fill="#315e9c" font-size="21" font-weight="750" text-anchor="middle" >02</text>
<text x="194" y="333" fill="#16283e" font-size="25" font-weight="760" text-anchor="start" >Frozen Judge · 冻结评测器</text>
<text x="194" y="362" fill="#607389" font-size="18" font-weight="450" text-anchor="start" >优化前固定工作负载、正确性检查、数值容差和计时协议</text>
<path d="M700 393 V411" fill="none" stroke="#8a9db2" stroke-width="3" stroke-linecap="round"/><path d="M689 401 L700 412 L711 401" fill="none" stroke="#8a9db2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="93" y="420" width="1214" height="222" rx="20" fill="#f7fafd" stroke="#dfe7ef" stroke-width="1.6"/>
<circle cx="139" cy="470" r="25" fill="#e9f0fa"/><text x="139" y="477" fill="#315e9c" font-size="21" font-weight="750" text-anchor="middle" >03</text>
<text x="194" y="467" fill="#16283e" font-size="25" font-weight="760" text-anchor="start" >Optimizer · Codex / Claude Code</text>
<text x="194" y="494" fill="#607389" font-size="17" font-weight="450" text-anchor="start" >每一轮：定位瓶颈 → 修改候选代码 → 比较性能 → 验证正确性</text>
