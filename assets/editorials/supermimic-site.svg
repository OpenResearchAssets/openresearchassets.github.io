</defs><rect x="0" y="0" width="1200" height="720" rx="0" fill="#fcfdff" stroke="none" stroke-width="1"/><text x="62" y="57" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="760" fill="#737b88" letter-spacing="1.4">OPENRESEARCHASSETS   /   RESEARCH WEBSITE STUDY   /   06</text><text x="60" y="138" font-family="Inter,Arial,Helvetica,sans-serif" font-size="61" font-weight="780" fill="#111722" letter-spacing="-2.8">Compute is no longer</text><text x="60" y="206" font-family="Inter,Arial,Helvetica,sans-serif" font-size="64" font-weight="800" fill="#111722" letter-spacing="-2.8">the bottleneck.</text><text x="62" y="247" font-family="Inter,Arial,Helvetica,sans-serif" font-size="19" font-weight="550" fill="#717f8e" >Bold claim → quantified comparison → inspectable evidence.</text><rect x="60" y="285" width="471" height="284" rx="18" fill="#edf2f8" stroke="none" stroke-width="1"/><text x="92" y="328" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="750" fill="#70869c" letter-spacing="2">THE CLAIM</text><text x="89" y="403" font-family="Inter,Arial,Helvetica,sans-serif" font-size="68" font-weight="800" fill="#162339" letter-spacing="-3">1 GPU</text><text x="93" y="449" font-family="Inter,Arial,Helvetica,sans-serif" font-size="22" font-weight="610" fill="#355774" >3 hours to surpass SONIC return</text><line x1="92" y1="475" x2="486" y2="475" stroke="#c8d5e1" stroke-width="1" stroke-linecap="round" /><text x="93" y="507" font-family="Inter,Arial,Helvetica,sans-serif" font-size="17" font-weight="550" fill="#667d93" >Baseline: 128 L40 GPUs  /  7 days</text><rect x="551" y="285" width="592" height="284" rx="18" fill="#ffffff" stroke="#e0e7ef" stroke-width="1"/><text x="586" y="329" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="770" fill="#6f829c" letter-spacing="1.1">EVIDENCE BEFORE DECORATION</text><line x1="607" y1="522" x2="1094" y2="522" stroke="#ccd9e6" stroke-width="2" stroke-linecap="round" /><line x1="607" y1="356" x2="607" y2="523" stroke="#ccd9e6" stroke-width="2" stroke-linecap="round" /><path d="M 610 510 L 664 477 L 719 445 L 770 407 L 832 372 L 902 354 L 967 350 L 1092 350" fill="none" stroke="#2e699a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M 610 523 L 665 500 L 722 486 L 783 462 L 839 438 L 904 421 L 968 398 L 1092 373" fill="none" stroke="#81bdba" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><line x1="608" y1="381" x2="1094" y2="381" stroke="#c59d7a" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 7"/><text x="594" y="554" font-family="Inter,Arial,Helvetica,sans-serif" font-size="14" font-weight="590" fill="#8190a3" >SCHEMATIC CURVES • NOT EXPERIMENTAL VALUES</text><line x1="60" y1="613" x2="1140" y2="613" stroke="#dce3ea" stroke-width="2" stroke-linecap="round" /><text x="60" y="648" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" fill="#6f7e90" >HERO</text><text x="242" y="648" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" fill="#6f7e90" >BENCHMARK</text><text x="480" y="648" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" fill="#6f7e90" >INTERACTIVE DEMO</text><text x="753" y="648" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" fill="#6f7e90" >METHOD</text><text x="1000" y="648" font-family="Inter,Arial,Helvetica,sans-serif" font-size="15" font-weight="750" fill="#6f7e90" >DEPLOYMENT</text><line x1="60" y1="664" x2="1140" y2="664" stroke="#d2deea" stroke-width="1" stroke-linecap="round" /><text x="60" y="689" font-family="Inter,Arial,Helvetica,sans-serif" font-size="13" font-weight="650" fill="#718399" letter-spacing=".8">EDITORIAL SEQUENCE STUDY  /  rewritten analytical mock, not official screenshot</text><text x="1100" y="689" font-family="Inter,Arial,Helvetica,sans-serif" font-size="12" font-weight="700" fill="#788ca2" text-anchor="end">NOT SOURCE ART</text></svg>
