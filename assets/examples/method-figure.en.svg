<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="670" viewBox="0 0 1320 670" role="img" aria-labelledby="title description">
<title id="title">Method example: conditional re-observation</title><desc id="description">Question: when is another view worth its cost? Conceptual pipeline, not a validated algorithm. All shapes and text are editable SVG; no empirical results are shown.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8ea0b6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1320" height="670" fill="#fff"/><rect x="20" y="19" width="1280" height="632" rx="26" fill="#fbfcfe" stroke="#e1e7ef"/>
<g font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="59" y="64" font-size="14" fill="#617994" font-weight="700" letter-spacing="1.4">OPEN RESEARCH ASSETS  /  WORKED EXAMPLE  01</text>
<text x="59" y="114" font-size="35" fill="#172333" font-weight="700" >Method example: conditional re-observation</text>
<text x="59" y="150" font-size="17" fill="#617084" font-weight="400" >Question: when is another view worth its cost? Conceptual pipeline, not a validated algorithm.</text>
<rect x="57" y="191" width="238" height="207" rx="18" fill="#f3f7fc" stroke="#dce5ee" stroke-width="1.5"/>
<text x="77" y="227" font-size="15" fill="#567493" font-weight="700" >01 / INPUT</text><text x="77" y="279" font-size="22" fill="#172b3e" font-weight="700" >Task &amp; observation</text><text x="77" y="329" font-size="16" fill="#536575" font-weight="500" >RGB + robot state</text><text x="77" y="360" font-size="16" fill="#536575" font-weight="500" >Goal &amp; constraints</text><rect x="337" y="191" width="238" height="207" rx="18" fill="#f0f6f6" stroke="#dce5ee" stroke-width="1.5"/>
<text x="357" y="227" font-size="15" fill="#567493" font-weight="700" >02 / PROPOSE</text><text x="357" y="279" font-size="22" fill="#172b3e" font-weight="700" >Propose an action</text><text x="357" y="329" font-size="16" fill="#536575" font-weight="500" >Plan from current view</text><text x="357" y="360" font-size="16" fill="#536575" font-weight="500" >No success implied</text><rect x="617" y="191" width="238" height="207" rx="18" fill="#eef3fa" stroke="#dce5ee" stroke-width="1.5"/>
<text x="637" y="227" font-size="15" fill="#567493" font-weight="700" >03 / CHECK</text><text x="637" y="279" font-size="22" fill="#172b3e" font-weight="700" >Decide to re-observe</text><text x="637" y="329" font-size="16" fill="#536575" font-weight="500" >Rule / uncertainty</text><text x="637" y="360" font-size="16" fill="#536575" font-weight="500" >Log trigger reason</text><rect x="897" y="191" width="360" height="207" rx="18" fill="#f4f7fb" stroke="#dce5ee" stroke-width="1.5"/>
<text x="917" y="227" font-size="15" fill="#567493" font-weight="700" >04 / ACT &amp; VERIFY</text><text x="917" y="279" font-size="22" fill="#172b3e" font-weight="700" >Execute &amp; verify</text><text x="917" y="329" font-size="16" fill="#536575" font-weight="500" >Log actual outcome</text><text x="917" y="360" font-size="16" fill="#536575" font-weight="500" >Success / failure / timeout</text><path d="M296 294H331" fill="none" stroke="#8ea0b6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M577 294H611" fill="none" stroke="#8ea0b6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M856 294H891" fill="none" stroke="#8ea0b6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><rect x="617" y="451" width="300" height="110" rx="16" fill="#fff" stroke="#b7cce0" stroke-width="1.5"/><text x="638" y="486" font-size="14" fill="#2e638b" font-weight="700" >OPTIONAL / SECOND VIEW</text><text x="638" y="518" font-size="17" fill="#203a52" font-weight="600" >Capture only if triggered</text><text x="638" y="545" font-size="15" fill="#617184" font-weight="500" >Count observation and cost</text><path d="M737 402V444" fill="none" stroke="#8ea0b6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><path d="M923 507H1083V403" fill="none" stroke="#8ea0b6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="626" y="430" font-size="14" fill="#64748b" font-weight="500" >If triggered</text><text x="864" y="435" font-size="14" fill="#64748b" font-weight="500" >Back to action</text><text x="59" y="458" font-size="15" fill="#566b7e" font-weight="500" >Base path: proceed directly when no second view is needed.</text><text x="59" y="488" font-size="15" fill="#566b7e" font-weight="500" >Log: same goal, policy, observation count and latency.</text>
<text x="60" y="630" font-size="14" fill="#64748b" font-weight="600" >TEACHING EXAMPLE  /  NOT A PUBLISHED STUDY  /  NO EMPIRICAL RESULTS</text>
</g></svg>