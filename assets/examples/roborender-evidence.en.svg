<title id="title">Real evidence: eight real-robot tasks</title><desc id="desc">Source: RoboRender authors' official results / not independently reproduced 可编辑编辑性分析图，原创绘制，非论文官方图。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" stroke="#899bae" stroke-width="1.5" fill="none" stroke-linecap="round"/></marker></defs><rect width="1420" height="700" fill="#fff"/><rect x="20" y="20" width="1380" height="660" rx="24" fill="#fbfcfe" stroke="#dce5ed"/><g font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="63" y="66" font-size="14" fill="#4f7393" font-weight="700" letter-spacing="1.35">OPEN RESEARCH ASSETS    /    REAL-PAPER CASE    /    EVIDENCE</text>
<text x="63" y="119" font-size="34" fill="#172537" font-weight="720" >Real evidence: eight real-robot tasks</text>
<text x="63" y="151" font-size="17" fill="#607287" font-weight="500" >Source: RoboRender authors' official results / not independently reproduced</text>
<rect x="56" y="188" width="1308" height="78" fill="#edf4f8" stroke="#cfdeeb" stroke-width="1.5" rx="16"/><text x="79" y="220" font-size="14" fill="#446a8c" font-weight="700" >EVIDENCE SCOPE</text><text x="79" y="252" font-size="18" fill="#254059" font-weight="620" >8 real-robot tasks × 10 rollouts per task = 80 trials per method; author-reported averages</text><text x="63" y="323" font-size="20" fill="#1d3145" font-weight="660" >Simulation</text><text x="63" y="349" font-size="14" fill="#677c90" font-weight="500" >Unmodified simulation renders</text><rect x="440" y="301" width="730" height="36" fill="#eef2f6" stroke="#eef2f6" stroke-width="1.5" rx="9"/><rect x="440" y="301" width="73" height="36" rx="9" fill="#afbfd0"/><text x="1190" y="328" font-size="25" fill="#17293b" font-weight="720" > 10%</text><text x="63" y="417" font-size="20" fill="#1d3145" font-weight="660" >Simulation + DR</text><text x="63" y="443" font-size="14" fill="#677c90" font-weight="500" >Traditional visual domain randomization</text><rect x="440" y="395" width="730" height="36" fill="#eef2f6" stroke="#eef2f6" stroke-width="1.5" rx="9"/><rect x="440" y="395" width="146" height="36" rx="9" fill="#7595b3"/><text x="1190" y="422" font-size="25" fill="#17293b" font-weight="720" > 20%</text><text x="63" y="511" font-size="20" fill="#1d3145" font-weight="660" >RoboRender</text><text x="63" y="537" font-size="14" fill="#677c90" font-weight="500" >Generative realistic appearance</text><rect x="440" y="489" width="730" height="36" fill="#eef2f6" stroke="#eef2f6" stroke-width="1.5" rx="9"/><rect x="440" y="489" width="520.125" height="36" rx="9" fill="#b56b46"/><text x="1190" y="516" font-size="25" fill="#17293b" font-weight="720" >71%</text><rect x="56" y="603" width="1307" height="49" fill="#fff" stroke="#dbe5ee" stroke-width="1.5" rx="11"/><text x="78" y="635" font-size="16" fill="#526b83" font-weight="500" >71% rounded on author's site; exact eight-task mean is 71.25%. Ten trials per task limits precision.</text>
<text x="62" y="659" font-size="14" fill="#64778c" font-weight="550" >Original editorial redraw from author materials · not the official paper Figure 1</text>
