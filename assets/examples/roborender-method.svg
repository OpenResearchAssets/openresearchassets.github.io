<text x="63" y="66" font-size="14" fill="#4f7393" font-weight="700" letter-spacing="1.35">OPEN RESEARCH ASSETS    /    REAL-PAPER CASE    /    METHOD</text>
<text x="63" y="119" font-size="34" fill="#172537" font-weight="720" >RoboRender：从模拟轨迹到真机评估</text>
<text x="63" y="151" font-size="17" fill="#607287" font-weight="500" >作者方法的独立抽象 / 两种数据来源不得混为一谈</text>
<rect x="56" y="185" width="1308" height="72" fill="#edf3f8" stroke="#cfdeec" stroke-width="1.5" rx="14"/><text x="77" y="211" font-size="14" fill="#477394" font-weight="700" >RENDERER LEARNS VISUAL REALISM</text><text x="78" y="242" font-size="19" fill="#25435c" font-weight="630" >真实机器人视频（AgiBot + DROID）  →  训练机器人条件视频生成模型</text><path d="M374 285V320" fill="none" stroke="#8b9baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="56" y="325" width="272" height="211" fill="#f1f6fa" stroke="#d6e1ed" stroke-width="1.5" rx="16"/><text x="76" y="361" font-size="15" fill="#4c6c89" font-weight="700" >01 / SIMULATION</text><text x="76" y="402" font-size="24" fill="#1d344b" font-weight="710" >模拟器输出</text><text x="76" y="440" font-size="17" fill="#506479" font-weight="500" >深度视频 / 机械臂 RGB Mask</text><text x="76" y="472" font-size="17" fill="#506479" font-weight="500" >语言指令 / 前帧条件</text><text x="76" y="504" font-size="16" fill="#5d7487" font-weight="500" >状态和动作由模拟器提供</text><rect x="380" y="325" width="306" height="211" fill="#e9f1f7" stroke="#c7d9e7" stroke-width="1.5" rx="16"/><text x="401" y="361" font-size="15" fill="#446b8b" font-weight="700" >02 / CONDITIONAL RENDERER</text><text x="401" y="405" font-size="25" fill="#1d344b" font-weight="730" >RoboRender</text><text x="401" y="440" font-size="17" fill="#506479" font-weight="500" >生成多视角 RGB 视频</text><text x="401" y="472" font-size="16" fill="#506479" font-weight="500" >尽量保持运动与几何约束</text><text x="401" y="504" font-size="16" fill="#506479" font-weight="500" >改变外观、材质与背景</text><rect x="743" y="325" width="278" height="211" fill="#f3f6fb" stroke="#d1dfea" stroke-width="1.5" rx="16"/><text x="765" y="361" font-size="15" fill="#486d90" font-weight="700" >03 / POLICY DATA</text><text x="765" y="404" font-size="23" fill="#1d344b" font-weight="700" >配对原动作标签</text><text x="765" y="441" font-size="16" fill="#516b80" font-weight="500" >生成 RGB + 模拟状态/动作</text><text x="765" y="472" font-size="16" fill="#516b80" font-weight="500" >微调视觉机器人策略 π₀.₅</text><text x="765" y="504" font-size="16" fill="#516b80" font-weight="500" >策略训练不使用真机示教</text><rect x="1074" y="325" width="290" height="211" fill="#f3f8f5" stroke="#c7dfd4" stroke-width="1.5" rx="16"/><text x="1095" y="361" font-size="15" fill="#457566" font-weight="700" >04 / REAL-WORLD EVAL</text><text x="1095" y="404" font-size="23" fill="#1d344b" font-weight="710" >真实机器人评估</text><text x="1095" y="441" font-size="17" fill="#516b75" font-weight="500" >8 个任务 / 3 种本体</text><text x="1095" y="472" font-size="17" fill="#516b75" font-weight="500" >策略零样本部署</text><text x="1095" y="504" font-size="17" fill="#516b75" font-weight="500" >报告成功率与失败</text><path d="M330 427H373" fill="none" stroke="#8b9baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M689 427H735" fill="none" stroke="#8b9baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1024 427H1065" fill="none" stroke="#8b9baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="62" y="585" font-size="16" fill="#446b8b" font-weight="700" >关键证据分离</text><text x="62" y="615" font-size="17" fill="#52677d" font-weight="500" >视频生成器用真实视频学习外观；下游策略以相同模拟轨迹 + 不同渲染方式做对照。</text>
<text x="62" y="659" font-size="14" fill="#64778c" font-weight="550" >原创分析绘制 · 根据 RoboRender 作者公开资料重构 · 不代表论文原 Figure 1</text>
