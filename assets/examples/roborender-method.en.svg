<title id="title">RoboRender: simulation to real-robot evaluation</title><desc id="desc">Original editorial abstraction / do not conflate two training sources 可编辑编辑性分析图，原创绘制，非论文官方图。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" stroke="#899bae" stroke-width="1.5" fill="none" stroke-linecap="round"/></marker></defs><rect width="1420" height="700" fill="#fff"/><rect x="20" y="20" width="1380" height="660" rx="24" fill="#fbfcfe" stroke="#dce5ed"/><g font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="63" y="66" font-size="14" fill="#4f7393" font-weight="700" letter-spacing="1.35">OPEN RESEARCH ASSETS    /    REAL-PAPER CASE    /    METHOD</text>
<text x="63" y="119" font-size="34" fill="#172537" font-weight="720" >RoboRender: simulation to real-robot evaluation</text>
<text x="63" y="151" font-size="17" fill="#607287" font-weight="500" >Original editorial abstraction / do not conflate two training sources</text>
<rect x="56" y="185" width="1308" height="72" fill="#edf3f8" stroke="#cfdeec" stroke-width="1.5" rx="14"/><text x="77" y="211" font-size="14" fill="#477394" font-weight="700" >RENDERER LEARNS VISUAL REALISM</text><text x="78" y="242" font-size="19" fill="#25435c" font-weight="630" >Real robot videos (AgiBot + DROID)  →  train the conditional video renderer</text><path d="M374 285V320" fill="none" stroke="#8b9baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="56" y="325" width="272" height="211" fill="#f1f6fa" stroke="#d6e1ed" stroke-width="1.5" rx="16"/><text x="76" y="361" font-size="15" fill="#4c6c89" font-weight="700" >01 / SIMULATION</text><text x="76" y="402" font-size="24" fill="#1d344b" font-weight="710" >Simulator outputs</text><text x="76" y="440" font-size="17" fill="#506479" font-weight="500" >Depth / arm RGB mask</text><text x="76" y="472" font-size="17" fill="#506479" font-weight="500" >Instruction / preceding frame</text><text x="76" y="504" font-size="16" fill="#5d7487" font-weight="500" >Sim provides states / actions</text><rect x="380" y="325" width="306" height="211" fill="#e9f1f7" stroke="#c7d9e7" stroke-width="1.5" rx="16"/><text x="401" y="361" font-size="15" fill="#446b8b" font-weight="700" >02 / CONDITIONAL RENDERER</text><text x="401" y="405" font-size="25" fill="#1d344b" font-weight="730" >RoboRender</text><text x="401" y="440" font-size="17" fill="#506479" font-weight="500" >Generate multi-view RGB</text><text x="401" y="472" font-size="16" fill="#506479" font-weight="500" >Retain motion / geometry</text><text x="401" y="504" font-size="16" fill="#506479" font-weight="500" >Change surfaces and clutter</text><rect x="743" y="325" width="278" height="211" fill="#f3f6fb" stroke="#d1dfea" stroke-width="1.5" rx="16"/><text x="765" y="361" font-size="15" fill="#486d90" font-weight="700" >03 / POLICY DATA</text><text x="765" y="404" font-size="23" fill="#1d344b" font-weight="700" >Preserve action labels</text><text x="765" y="441" font-size="16" fill="#516b80" font-weight="500" >RGB + sim states/actions</text><text x="765" y="472" font-size="16" fill="#516b80" font-weight="500" >Fine-tune policy π₀.₅</text><text x="765" y="504" font-size="16" fill="#516b80" font-weight="500" >No real policy fine-tuning</text><rect x="1074" y="325" width="290" height="211" fill="#f3f8f5" stroke="#c7dfd4" stroke-width="1.5" rx="16"/><text x="1095" y="361" font-size="15" fill="#457566" font-weight="700" >04 / REAL-WORLD EVAL</text><text x="1095" y="404" font-size="23" fill="#1d344b" font-weight="710" >Real-robot evaluation</text><text x="1095" y="441" font-size="17" fill="#516b75" font-weight="500" >8 tasks / 3 embodiments</text><text x="1095" y="472" font-size="17" fill="#516b75" font-weight="500" >Zero-shot deployment</text><text x="1095" y="504" font-size="17" fill="#516b75" font-weight="500" >Record success / failure</text><path d="M330 427H373" fill="none" stroke="#8b9baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M689 427H735" fill="none" stroke="#8b9baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1024 427H1065" fill="none" stroke="#8b9baf" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="62" y="585" font-size="16" fill="#446b8b" font-weight="700" >Keep sources separate</text><text x="62" y="615" font-size="17" fill="#52677d" font-weight="500" >Renderer learns realism from real video; policy baselines share sim trajectories with varied renderings.</text>
<text x="62" y="659" font-size="14" fill="#64778c" font-weight="550" >Original editorial redraw from author materials · not the official paper Figure 1</text>
