<rect x="56" y="188" width="1308" height="78" fill="#edf4f8" stroke="#cfdeeb" stroke-width="1.5" rx="16"/><text x="79" y="220" font-size="14" fill="#446a8c" font-weight="700" >EVIDENCE SCOPE</text><text x="79" y="252" font-size="18" fill="#254059" font-weight="620" >8 个真实机器人任务  ×  每个任务 10 次 rollout ＝ 每组 80 次评估；以下是作者报告的宏平均成功率</text><text x="63" y="323" font-size="20" fill="#1d3145" font-weight="660" >Simulation</text><text x="63" y="349" font-size="14" fill="#677c90" font-weight="500" >原始模拟器渲染 / Raw Sim</text><rect x="440" y="301" width="730" height="36" fill="#eef2f6" stroke="#eef2f6" stroke-width="1.5" rx="9"/><rect x="440" y="301" width="73" height="36" rx="9" fill="#afbfd0"/><text x="1190" y="328" font-size="25" fill="#17293b" font-weight="720" > 10%</text><text x="63" y="417" font-size="20" fill="#1d3145" font-weight="660" >Simulation + DR</text><text x="63" y="443" font-size="14" fill="#677c90" font-weight="500" >传统外观随机化 / Domain Randomization</text><rect x="440" y="395" width="730" height="36" fill="#eef2f6" stroke="#eef2f6" stroke-width="1.5" rx="9"/><rect x="440" y="395" width="146" height="36" rx="9" fill="#7595b3"/><text x="1190" y="422" font-size="25" fill="#17293b" font-weight="720" > 20%</text><text x="63" y="511" font-size="20" fill="#1d3145" font-weight="660" >RoboRender</text><text x="63" y="537" font-size="14" fill="#677c90" font-weight="500" >视频生成式真实外观 / Generated RGB</text><rect x="440" y="489" width="730" height="36" fill="#eef2f6" stroke="#eef2f6" stroke-width="1.5" rx="9"/><rect x="440" y="489" width="520.125" height="36" rx="9" fill="#b56b46"/><text x="1190" y="516" font-size="25" fill="#17293b" font-weight="720" >71%</text><rect x="56" y="603" width="1307" height="49" fill="#fff" stroke="#dbe5ee" stroke-width="1.5" rx="11"/><text x="78" y="635" font-size="16" fill="#526b83" font-weight="500" >71% 为作者整数展示值；逐任务表精确平均为 71.25%。10 次/任务带来有限的估计精度。</text>
