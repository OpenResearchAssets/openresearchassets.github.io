<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="670" viewBox="0 0 1320 670" role="img" aria-labelledby="title description">
<title id="title">实验案例：以证据检验科学主张</title><desc id="description">三组设计隔离观察策略；所有实验数值与结论保持空缺，等待真实结果。 所有形状和文本均为可编辑 SVG；无真实实验数据。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M1 1 L7 4.5 L1 8" fill="none" stroke="#8ea0b6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1320" height="670" fill="#fff"/><rect x="20" y="19" width="1280" height="632" rx="26" fill="#fbfcfe" stroke="#e1e7ef"/>
<g font-family="Arial, Noto Sans CJK SC, PingFang SC, Microsoft YaHei, sans-serif">
<text x="59" y="64" font-size="14" fill="#617994" font-weight="700" letter-spacing="1.4">OPEN RESEARCH ASSETS  /  WORKED EXAMPLE  02</text>
<text x="59" y="114" font-size="35" fill="#172333" font-weight="700" >实验案例：以证据检验科学主张</text>
<text x="59" y="150" font-size="17" fill="#617084" font-weight="400" >三组设计隔离观察策略；所有实验数值与结论保持空缺，等待真实结果。</text>
<rect x="56" y="184" width="1208" height="89" rx="18" fill="#edf3fa" stroke="#dce5ee" stroke-width="1.5"/><text x="79" y="218" font-size="15" fill="#48688a" font-weight="700" >预注册问题 / Research question</text><text x="79" y="253" font-size="21" fill="#203247" font-weight="650" >在给定延迟与观测预算下，有条件二次观察是否更好？</text><rect x="56" y="297" width="375" height="166" rx="18" fill="#fff" stroke="#dce5ee" stroke-width="1.5"/><text x="78" y="333" font-size="15" fill="#456c8b" font-weight="700" >A / BASELINE</text><text x="78" y="388" font-size="23" fill="#162c40" font-weight="700" >始终单次观察</text><text x="78" y="430" font-size="16" fill="#62758a" font-weight="500" >无额外观察，记录成本</text><rect x="472" y="297" width="375" height="166" rx="18" fill="#fff" stroke="#dce5ee" stroke-width="1.5"/><text x="494" y="333" font-size="15" fill="#456c8b" font-weight="700" >B / CONTROL</text><text x="494" y="388" font-size="23" fill="#162c40" font-weight="700" >始终两次观察</text><text x="494" y="430" font-size="16" fill="#62758a" font-weight="500" >等额新增观测作对照</text><rect x="888" y="297" width="375" height="166" rx="18" fill="#eaf3f7" stroke="#b5cedd" stroke-width="1.5"/><text x="910" y="333" font-size="15" fill="#456c8b" font-weight="700" >C / CANDIDATE</text><text x="910" y="388" font-size="23" fill="#162c40" font-weight="700" >有条件二次观察</text><text x="910" y="430" font-size="16" fill="#62758a" font-weight="500" >同样上限，记录触发率</text><rect x="57" y="497" width="763" height="105" rx="18" fill="#fff" stroke="#dce5ee" stroke-width="1.5"/><text x="78" y="528" font-size="15" fill="#516b8b" font-weight="700" >公平性锁定 / FAIRNESS</text><text x="78" y="563" font-size="16" fill="#40526c" font-weight="500" >同一任务集、模型、预算与失败定义；种子和分组预先登记</text><text x="78" y="588" font-size="15" fill="#64748b" font-weight="500" >区别只在观察策略，不改变其他模块</text><rect x="840" y="497" width="421" height="105" rx="18" fill="#eff5f9" stroke="#dce5ee" stroke-width="1.5"/><text x="862" y="528" font-size="15" fill="#456c8b" font-weight="700" >报告指标 / OUTCOMES</text><text x="862" y="559" font-size="17" fill="#293f54" font-weight="600" >任务成功率 · 延迟 · 观测成本</text><text x="862" y="585" font-size="15" fill="#6a7789" font-weight="500" >状态：待采集，不填写虚构结果</text>
<text x="60" y="630" font-size="14" fill="#64748b" font-weight="600" >教学示例 · 非已发表研究 · 未提供真实实验结果</text>
</g></svg>